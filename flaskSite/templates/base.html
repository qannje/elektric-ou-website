<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ELEKTRIC OÜ{% endblock %}</title>

    <!-- Bootstrap + Font Awesome -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Header -->
    <header class="bg-primary text-white">
        <div class="container py-3">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container-fluid">
                    <a class="navbar-brand fw-bold" href="/">ELEKTRIC OÜ</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home me-1"></i> Home</a></li>
                            <li class="nav-item"><a class="nav-link" href="/about"><i class="fas fa-users me-1"></i> About</a></li>
                            <li class="nav-item"><a class="nav-link" href="/contact"><i class="fas fa-phone me-1"></i> Contact</a></li>
                            <li class="nav-item"><a class="nav-link" href="/services"><i class="fas fa-bolt me-1"></i> Services</a></li>
                            <li class="nav-item"><a class="nav-link" href="/articles"><i class="fas fa-book me-1"></i> Articles</a></li>
                        </ul>
                        <a href="/create_article" class="btn btn-light ms-3"><i class="fa-regular fa-pen-to-square"></i> Create article</a>
                    </div>
                </div>
            </nav>
        </div>
    </header>


    <!-- Content -->
    <main class="flex-grow-1">
        <div class="container py-4">
            {% block content %}
            {% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div>
            © 2023 ELEKTRIC OÜ. All rights reserved.
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
